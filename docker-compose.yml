services:
  # --- Postgres: mandatory (app requires it for anti-spam + trust history) ---
  db:
    image: postgres:16-alpine
    container_name: issuefinder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: issue_finder
      POSTGRES_PASSWORD: ${DB_PASSWORD:-issue_finder}
      POSTGRES_DB: issue_finder
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue_finder"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # --- Issue finder (scans GitHub, sends Telegram with buttons) ---
  issue-finder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: issue-finder
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      DB_CONNECTION_STRING: "host=db user=issue_finder password=${DB_PASSWORD:-issue_finder} dbname=issue_finder sslmode=disable port=5432"
      CHECK_INTERVAL: "${CHECK_INTERVAL:-3600}"
      CONTRIB_POLICY: ${CONTRIB_POLICY:-}
    # Resource caps so it coexists with Jellyfin / other containers
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  dbdata:
