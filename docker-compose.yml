services:
  # --- Postgres: mandatory (app requires it for anti-spam + trust history) ---
  # Legacy layout: bind mount ./pgdata (excluded from image via .dockerignore),
  # user/db "issue-finder" — matches the stack that has run since 2026-08-07.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: issue-finder
      POSTGRES_PASSWORD: issue-finder-pass
      POSTGRES_DB: issue-finder
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue-finder"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # --- Issue finder (scans GitHub, sends Telegram with buttons) ---
  issue-finder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: issue-finder
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS}
      DB_CONNECTION_STRING: "host=postgres user=issue-finder password=issue-finder-pass dbname=issue-finder sslmode=disable port=5432"
      CHECK_INTERVAL: "${CHECK_INTERVAL:-3600}"
      POLL_INTERVAL: "${POLL_INTERVAL:-300}"
      CONTRIB_POLICY: ${CONTRIB_POLICY:-}
    # Resource caps so it coexists with Jellyfin / other containers
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
